<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 - User Directory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="users.js" defer></script>
  </head>

  <body>
    <header>
      <h1>User Directory</h1>
      <p>Explore and search a list of users.</p>
    </header>

    <main>
      <section>
        <button type="button" id="load-btn">Load Users</button>

        <label for="filter-input">Search users</label>
        <input
          type="text"
          id="filter-input"
          placeholder="Search by name, email, or city..."
        />

        <p id="status" aria-live="polite">Click Load Users to begin.</p>

        <ul id="users-list"></ul>
      </section>
    </main>
  </body>
</html>
