<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 - User Directory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>User Directory</h1>
      <p>Explore and search a list of users.</p>
    </header>

    <main>
      <section>
        <label for="filterInput">Search users</label>
        <input
          type="text"
          id="filterInput"
          placeholder="Search by name, email, or city..."
        />

        <p id="statusMessage" aria-live="polite">Loading users...</p>

        <ul id="userList"></ul>
      </section>
    </main>
  </body>
</html>
